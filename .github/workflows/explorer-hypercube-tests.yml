name: Explorer hypercube adapter tests
on:
  pull_request:
    paths: ['explorer/**', 'src/mimulus_decoder/**', '.github/workflows/explorer-hypercube-tests.yml']
  push:
    branches: [main]
    paths: ['explorer/**', 'src/mimulus_decoder/**', '.github/workflows/explorer-hypercube-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node explorer/test-token-cube.js
      - run: node pilot/test.js
      - run: node historical/test.js
