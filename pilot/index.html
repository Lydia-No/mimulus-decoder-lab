<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mimulus — Memory Mirror</title>
<style>
:root{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#08110d;color:#e8f4eb}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 20%,#183225 0,#08110d 48%,#050806 100%)}main{max-width:780px;margin:auto;padding:28px 18px 80px}.brand{letter-spacing:.22em;text-transform:uppercase;color:#92d6aa;font-size:12px}.card{margin-top:20px;padding:28px;border:1px solid #31503d;border-radius:18px;background:#0c1711dd;box-shadow:0 18px 70px #0008}h1{font-size:clamp(30px,6vw,58px);margin:.15em 0}h2{font-size:24px}p{line-height:1.6;color:#c6d8ca}.objects{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:24px 0}.obj{text-align:center;padding:14px 5px;border:1px solid #31503d;border-radius:12px;font-size:12px}.glyph{display:block;font-size:30px;margin-bottom:8px}button{font:inherit;border:1px solid #75b88b;color:#eafff0;background:#173622;padding:13px 18px;border-radius:10px;cursor:pointer}button:hover{background:#20502f}.secondary{background:transparent;border-color:#45644f}label{display:block;margin:15px 0 6px;color:#a9c7b1}input,select,textarea{width:100%;font:inherit;color:#edf8ef;background:#07100b;border:1px solid #385541;border-radius:9px;padding:11px}textarea{min-height:90px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hidden{display:none}.meter{height:6px;background:#17231b;border-radius:10px;overflow:hidden;margin:14px 0 24px}.meter span{display:block;height:100%;background:#75b88b}.small{font-size:12px;color:#789483}.seal{padding:16px;border:1px dashed #53755e;border-radius:12px;color:#9bc2a6}.change{padding:9px 0;border-bottom:1px solid #203326}.aligned{color:#d7bd76}.footer{margin-top:20px;font-size:11px;color:#607768}@media(max-width:600px){.objects{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
</style></head><body><main><div class="brand">Mimulus Decoder Lab · Pilot 002</div><div id="app" class="card"></div><div class="footer">Local pilot: responses stay in this browser unless you export them. This is an experimental memory-reconstruction instrument, not a psychological assessment.</div></main>
<script>
const app=document.querySelector('#app');const KEY='mimulus-memory-pilot-v1';let data=JSON.parse(localStorage.getItem(KEY)||'null')||{stage:0,id:crypto.randomUUID(),condition:null,m0:null,r1:null};
const save=()=>localStorage.setItem(KEY,JSON.stringify(data));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fields=['cube_color','cube_size','ladder_material','ladder_position','horse_color','horse_moving','flowers_color','flowers_position','storm_distance','storm_intensity'];
const conditions=[{id:'C1',title:'Reading A',text:'For the next minute, consider the scene as a map of approach and connection. Imagine that what matters tends to draw nearer, become more active, or enter relation with the other elements.',pred:{storm_distance:'near',horse_moving:'yes',ladder_position:'touching cube',flowers_position:'near cube'}},{id:'C2',title:'Reading B',text:'For the next minute, consider the scene as a map of boundaries and independence. Imagine that what matters tends to remain separate, become still, or hold distance from the other elements.',pred:{storm_distance:'far',horse_moving:'no',ladder_position:'separate',flowers_position:'far from cube'}},{id:'C0',title:'Neutral interval',text:'For the next minute, simply notice that imagined scenes can contain many arbitrary details. Do not try to interpret what any object means.',pred:{}}];
function progress(n){return `<div class="meter"><span style="width:${n}%"></span></div>`}
function start(){app.innerHTML=`${progress(5)}<h1>Memory Mirror</h1><p>Build a scene in your mind. We will freeze your first description, introduce a short reading, distract you briefly, then ask you to reconstruct the original scene. At the end you can inspect exactly what changed.</p><div class="objects"><div class="obj"><span class="glyph">◇</span>cube</div><div class="obj"><span class="glyph">╱╲</span>ladder</div><div class="obj"><span class="glyph">♞</span>horse</div><div class="obj"><span class="glyph">✿</span>flowers</div><div class="obj"><span class="glyph">☁</span>storm</div></div><p class="small">Don't assign symbolic meanings. Just picture the scene as vividly as you can: positions, materials, movement, distance, atmosphere.</p><button id="begin">I have the scene</button>`;document.querySelector('#begin').onclick=()=>{data.stage=1;save();render()}}
function form(title,sub,prefix){app.innerHTML=`${progress(prefix==='m0'?25:75)}<h2>${title}</h2><p>${sub}</p><div class="grid"><div><label>Cube color / appearance</label><input name="cube_color"></div><div><label>Cube size</label><select name="cube_size"><option></option><option>small</option><option>medium</option><option>large</option><option>huge</option></select></div><div><label>Ladder material</label><input name="ladder_material"></div><div><label>Ladder relative to cube</label><select name="ladder_position"><option></option><option>touching cube</option><option>near cube</option><option>separate</option><option>far from cube</option></select></div><div><label>Horse color / appearance</label><input name="horse_color"></div><div><label>Horse moving?</label><select name="horse_moving"><option></option><option>yes</option><option>no</option></select></div><div><label>Flowers color / appearance</label><input name="flowers_color"></div><div><label>Flowers relative to cube</label><select name="flowers_position"><option></option><option>on/touching cube</option><option>near cube</option><option>separate</option><option>far from cube</option></select></div><div><label>Storm distance</label><select name="storm_distance"><option></option><option>near</option><option>middle</option><option>far</option></select></div><div><label>Storm intensity</label><select name="storm_intensity"><option></option><option>mild</option><option>moderate</option><option>violent</option></select></div></div><label>Describe the whole scene in your own words</label><textarea name="free"></textarea><button id="seal">${prefix==='m0'?'Seal this first memory':'Freeze reconstruction'}</button>`;document.querySelector('#seal').onclick=()=>{const q={};fields.forEach(k=>q[k]=document.querySelector(`[name=${k}]`).value||null);q.free=document.querySelector('[name=free]').value;if(prefix==='m0'){data.m0=q;data.condition=conditions[Math.floor(Math.random()*conditions.length)];data.stage=2}else{data.r1=q;data.stage=5}save();render()}}
function intervention(){let c=data.condition;app.innerHTML=`${progress(45)}<h2>${c.title}</h2><div class="seal"><p>${c.text}</p></div><p>Read it once, then continue. Your original description is sealed and won't be shown again until the end.</p><button id="next">Continue</button>`;document.querySelector('#next').onclick=()=>{data.stage=3;save();render()}}
function distract(){let nums=Array.from({length:5},()=>Math.floor(Math.random()*80+10));app.innerHTML=`${progress(55)}<h2>Clear the scene</h2><p>Before reconstructing it, do this unrelated task. Add these numbers:</p><h1 style="letter-spacing:.15em">${nums.join(' + ')}</h1><input id="sum" inputmode="numeric" placeholder="total"><p class="small">The answer doesn't matter scientifically; the task just interrupts active rehearsal.</p><button id="done">Done</button>`;document.querySelector('#done').onclick=()=>{data.stage=4;save();render()}}
function results(){let c=data.condition,changes=[];fields.forEach(k=>{let a=data.m0[k],b=data.r1[k];if(a!==b){let kind=!a?'addition':!b?'omission':(c.pred[k]&&b===c.pred[k]?'interpretation-aligned':'changed');changes.push({k,a,b,kind})}});app.innerHTML=`${progress(100)}<h2>Your reconstruction trace</h2><p>This compares what you recorded before the reading with what you later reconstructed. It does <b>not</b> tell us why a change occurred.</p><div class="seal"><b>Condition:</b> ${esc(c.id)} · ${esc(c.title)}<br><span class="small">The condition was assigned before reconstruction.</span></div><h3>${changes.length} recorded feature changes</h3>${changes.length?changes.map(x=>`<div class="change ${x.kind==='interpretation-aligned'?'aligned':''}"><b>${esc(x.k.replaceAll('_',' '))}</b>: ${esc(x.a||'—')} → ${esc(x.b||'—')} <span class="small">[${x.kind}]</span></div>`).join(''):'<p>No coded feature changed.</p>'}<h3>Original free description</h3><p>${esc(data.m0.free)}</p><h3>Reconstruction</h3><p>${esc(data.r1.free)}</p><p class="small">An “interpretation-aligned” label means only that a predeclared feature moved in the direction predicted by the assigned frame. A single run cannot distinguish framing effects from ordinary memory variation.</p><button id="export">Export my trace</button> <button class="secondary" id="reset">Start over</button>`;document.querySelector('#export').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`mimulus-${data.id}.json`;a.click();URL.revokeObjectURL(a.href)};document.querySelector('#reset').onclick=()=>{localStorage.removeItem(KEY);data={stage:0,id:crypto.randomUUID(),condition:null,m0:null,r1:null};render()}}
function render(){if(data.stage===0)return start();if(data.stage===1)return form('Freeze the first scene','Record what you actually pictured. Leave anything blank that you did not notice.','m0');if(data.stage===2)return intervention();if(data.stage===3)return distract();if(data.stage===4)return form('Reconstruct the original scene','Without trying to improve it, describe the scene you remember imagining at the beginning.','r1');return results()}render();
</script></body></html>
