[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mimulus-decoder-lab"
version = "0.0.1"
description = "Experimental provenance-preserving multi-decoder lab"
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mimulus_decoder = ["decoder.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
